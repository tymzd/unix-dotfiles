# ==========================================
# 1. Prefix Customization
# ==========================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ==========================================
# 2. General Usability & Mouse
# ==========================================
set -g mouse on
set -g history-limit 50000      # Boost scrollback buffer from default 2000 lines

# Ensure terminal colors look correct (especially for Vim themes)
set -g default-terminal "screen-256color"

# Fast command execution (removes the default delay when hitting Esc)
set -s escape-time 0

# ==========================================
# 3. Vim Navigation & Splits
# ==========================================
setw -g mode-keys vi

# Visual splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Quick pane switching with Alt + Vim keys (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==========================================
# 4. Configuration Reload Shortcut
# ==========================================
# Press Prefix + r to reload this config file instantly
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

