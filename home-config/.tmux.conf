# ==========================================
# 1. Prefix Customization
# ==========================================
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ==========================================
# 2. General Usability & Mouse
# ==========================================
set -g mouse on
set -g history-limit 50000      # Boost scrollback buffer from default 2000 lines

# Send tmux copies to the local (laptop) clipboard via OSC 52, even over SSH
set -s set-clipboard on
set -as terminal-features ',*:clipboard'

# Ensure terminal colors look correct (especially for Vim themes)
set -g default-terminal "screen-256color"

# Fast command execution (removes the default delay when hitting Esc)
set -s escape-time 0

# ==========================================
# 3. Vim Navigation & Splits
# ==========================================
setw -g mode-keys vi

# Visual splits
bind | split-window -h -c "#{pane_current_path}"
bind \ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Quick pane switching with Alt + Vim keys (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane switching with Prefix + Vim keys
# (note: Prefix + l replaces the default "last-window" binding)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Prefix + Shift + Vim keys (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Heavier pane dividers
set -g pane-border-lines heavy
set -g pane-active-border-style fg=yellow

# ==========================================
# 4. Configuration Reload Shortcut
# ==========================================
# Press Prefix + r to reload this config file instantly
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

